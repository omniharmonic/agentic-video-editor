<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css">
<style>
  #col { position: absolute; left: var(--mx); right: var(--mx); top: 50%; transform: translateY(-50%); }
  #heading { font-size: var(--fs-display); line-height: 1.06; color: var(--c-paper); letter-spacing: var(--tr-display); max-width: 85%; }
  #body { font-size: var(--fs-name); line-height: 1.3; color: var(--c-paper-dim); margin-top: calc(28 * var(--u)); max-width: 62%; font-family: var(--f-serif); }
  #rule { height: calc(2 * var(--u)); background: var(--c-stone); transform-origin: 0 50%; margin: calc(48 * var(--u)) 0 calc(30 * var(--u)); }
  .ln { display: flex; align-items: baseline; gap: calc(28 * var(--u)); margin-top: calc(14 * var(--u)); }
  .l { color: var(--c-clay); min-width: calc(220 * var(--u)); }
  .v { font-size: var(--fs-body); color: var(--c-paper); letter-spacing: 0.02em; }
</style></head><body>
<div id="stage"><div id="col"><div id="heading" class="serif"></div><div id="body"></div><div id="rule"></div><div id="lines"></div></div></div>
<script src="../../lib/timeline.js"></script>
<script>
  var P = AVE.props, M = AVE.tokens.motion, $ = AVE.el, rows = [];
  AVE.text("heading", P.heading); AVE.text("body", P.body);
  (P.lines || []).forEach(function (x) {
    var d = document.createElement("div"); d.className = "ln";
    d.innerHTML = '<div class="l label"></div><div class="v"></div>';
    d.querySelector(".l").textContent = x.label; d.querySelector(".v").textContent = x.value;
    $("lines").appendChild(d); rows.push(d);
  });
  if (!rows.length) { $("rule").style.display = "none"; }
  AVE.ready(function (t) {
    var h = AVE.hold(t);
    $("col").style.opacity = h;
    AVE.rise($("heading"), AVE.phase(t, 0.2, M.in_s * 1.3, "out"));
    $("body").style.opacity = AVE.phase(t, 0.7, M.in_s, "out");
    $("rule").style.transform = "scaleX(" + AVE.phase(t, 1.0, M.in_s * 1.4, "out") + ")";
    rows.forEach(function (d, i) { AVE.rise(d, AVE.phase(t, 1.3 + i * M.stagger_s * 2, M.in_s, "out")); });
  });
</script></body></html>
