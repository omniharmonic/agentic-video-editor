<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css"><link rel="stylesheet" href="../../lib/stills.css">
<style>
  /* Before and after: two library photographs side by side across the top, a label under each, an optional title beneath. */
  #photos { position: absolute; left: 0; right: 0; top: 0; height: 66%; display: flex; gap: calc(6 * var(--s)); background: var(--st-bg); }
  .ph { flex: 1 1 0; min-width: 0; overflow: hidden; background: var(--st-panel); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #safe { top: calc(66% + 30 * var(--s)); }
  #labels { flex: 0 0 auto; display: flex; gap: calc(6 * var(--s)); }
  #labels > div { flex: 1 1 0; min-width: 0; }
  #body { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; margin-top: calc(22 * var(--s)); }
  #title { line-height: 1.1; margin: 0; }
</style></head><body>
<div id="stage"><div id="photos"><div class="ph"><img id="imgb" alt=""></div><div class="ph"><img id="imga" alt=""></div></div><div id="safe">
  <div id="labels"><div id="lb" class="lab" data-measure="before_label"></div><div id="la" class="lab" data-measure="after_label"></div></div>
  <div id="body"><div id="group" style="width:100%"><div id="title" class="serif-d" data-measure="title"></div></div></div>
</div></div>
<script src="../../lib/timeline.js"></script><script src="../../lib/stills.js"></script>
<script>
  var P = AVE.props, S = STILL, $ = AVE.el, imgs = [];
  S.setText("lb", P.before_label || "Before"); S.setText("la", P.after_label || "After");
  $("title").textContent = S.typo(P.title || "");
  if (!P.title) $("body").style.display = "none";
  [["imgb", P._before_url], ["imga", P._after_url]].forEach(function (p) { var im = $(p[0]); im.src = p[1]; imgs.push(im); });
  S.boot(function () {
    var body = $("body"), group = $("group");
    if (!P.title) return;
    S.fit($("title"), S.px(S.TY.title * 0.7), S.px(S.TY.title_min * 0.6), function () {
      return group.getBoundingClientRect().height <= body.clientHeight && $("title").scrollWidth <= $("title").clientWidth + 1;
    });
  }, imgs);
</script></body></html>
