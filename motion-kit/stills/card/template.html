<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css"><link rel="stylesheet" href="../../lib/stills.css">
<style>
  /* One flexible text card for the studio's announcement, offer, stat-card and event templates: kicker, a big figure, a title, a line beneath, a detail, a call to action.
     Empty parts take no space. The templates differ in their slots (and their names for them), never in this page. */
  #head { flex: 0 0 auto; margin-bottom: calc(24 * var(--s)); }
  #body { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; }
  #group { width: 100%; }
  #kicker { margin-bottom: calc(24 * var(--s)); }
  #rule { margin-bottom: calc(40 * var(--s)); }
  #big { line-height: 1.0; margin: 0 0 calc(26 * var(--s)); }
  #title { line-height: 1.12; margin: 0; }
  #sub { margin-top: calc(32 * var(--s)); }
  #detail { margin-top: calc(18 * var(--s)); }
  #cta { margin-top: calc(32 * var(--s)); }
</style></head><body>
<div id="stage"><div id="safe">
  <div id="head"><div id="show" class="lab" data-measure="show"></div></div>
  <div id="body"><div id="group"><div id="kicker" class="lab" data-measure="kicker"></div><div id="rule" class="rule"></div>
    <div id="big" class="serif-d" data-measure="big"></div><div id="title" class="serif-d" data-measure="title"></div>
    <div id="sub" class="name" data-measure="sub"></div><div id="detail" class="lab" data-measure="detail"></div><div id="cta" class="lab" data-measure="cta"></div></div></div>
</div></div>
<script src="../../lib/timeline.js"></script><script src="../../lib/stills.js"></script>
<script>
  var P = AVE.props, S = STILL, $ = AVE.el;
  var big = P.big || P.price || P.stat || P.when || "";                    /* announcement: none; offer: price; stat-card: stat; event: when */
  var sub = P.sub || P.source || "";
  var detail = P.detail || P.valid || [P.time, P.place].filter(Boolean).join("  ·  ");
  S.setText("show", P.show); S.setText("kicker", P.kicker); S.setText("sub", sub); S.setText("detail", detail); S.setText("cta", P.cta);
  $("big").textContent = S.typo(big); $("title").textContent = S.typo(P.title || "");
  if (!big) $("big").style.display = "none";
  if (!P.title) $("title").style.display = "none";
  if (!P.kicker) $("kicker").style.display = "none";
  S.boot(function () {
    var body = $("body"), group = $("group");
    function fitsAll() { return group.getBoundingClientRect().height <= body.clientHeight; }
    if (big) {                                                              /* the figure first: as large as it can be on one line, at most half the body */
      S.fit($("big"), S.px(S.TY.number * 1.25), S.px(S.TY.number * 0.5), function () {
        return $("big").scrollWidth <= $("big").clientWidth + 1 && $("big").getBoundingClientRect().height <= body.clientHeight * 0.5;
      });
    }
    S.fit($("title"), S.px(S.TY.title * (big ? 0.8 : 1.3)), S.px(S.TY.title_min), function () {
      return fitsAll() && $("title").scrollWidth <= $("title").clientWidth + 1;
    });
  });
</script></body></html>
