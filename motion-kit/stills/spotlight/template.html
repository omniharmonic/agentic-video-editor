<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css"><link rel="stylesheet" href="../../lib/stills.css">
<style>
  /* Product spotlight: a library photograph across the top, the words beneath it. The photo is full bleed; the text stays inside the safe area. */
  #photo { position: absolute; left: 0; right: 0; top: 0; height: 60%; overflow: hidden; background: var(--st-panel); }
  #photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #safe { top: calc(60% + 34 * var(--s)); }
  #body { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; }
  #group { width: 100%; }
  #title { line-height: 1.1; margin: 0; }
  #sub { margin-top: calc(18 * var(--s)); }
  #detail { margin-top: calc(12 * var(--s)); }
</style></head><body>
<div id="stage"><div id="photo"><img id="img" alt=""></div><div id="safe">
  <div id="body"><div id="group"><div id="title" class="serif-d" data-measure="title"></div>
    <div id="sub" class="name" data-measure="sub"></div><div id="detail" class="lab" data-measure="detail"></div></div></div>
</div></div>
<script src="../../lib/timeline.js"></script><script src="../../lib/stills.js"></script>
<script>
  var P = AVE.props, S = STILL, $ = AVE.el, imgs = [];
  $("title").textContent = S.typo(P.title); S.setText("sub", P.sub); S.setText("detail", [P.detail, P.show].filter(Boolean).join("  ·  "));
  var im = $("img");
  im.style.objectPosition = ((P.image_focus_x == null ? 0.5 : P.image_focus_x) * 100) + "% 50%";
  im.src = P._image_url; imgs.push(im);
  S.boot(function () {
    var body = $("body"), group = $("group");
    S.fit($("title"), S.px(S.TY.title * 0.9), S.px(S.TY.title_min * 0.7), function () {
      return group.getBoundingClientRect().height <= body.clientHeight && $("title").scrollWidth <= $("title").clientWidth + 1;
    });
  }, imgs);
</script></body></html>
