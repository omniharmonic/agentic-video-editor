<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css">
<style>
  /* card: opaque ink, show name small above, the title large in the serif, a clay rule; quick (about 1.3 s in total). */
  #bg { position: absolute; inset: 0; background: var(--c-ink); }
  #col { position: absolute; left: var(--mx); right: var(--mx); top: 44%; transform: translateY(-50%); }
  #cshow { color: var(--c-clay); margin-bottom: calc(34 * var(--u)); }
  #crule { width: calc(72 * var(--u)); height: calc(4 * var(--u)); background: var(--c-clay); transform-origin: 0 50%; margin-bottom: calc(36 * var(--u)); }
  #ctitle { text-wrap: balance; font-size: calc(92 * var(--u)); line-height: 1.06; color: var(--c-paper); letter-spacing: var(--tr-display); }
  /* overlay: the lower-third idiom (clay rule, ink panel) sized for a phone, sitting above the captions. */
  #lt { position: absolute; left: var(--mx); right: calc(var(--mx) * 1.6); display: flex; align-items: stretch; }
  #orule { width: calc(6 * var(--u)); background: var(--c-clay); transform-origin: 50% 100%; }
  #panel { background: rgba(27, 24, 20, var(--a-panel)); padding: calc(20 * var(--u)) calc(34 * var(--u)) calc(24 * var(--u)) calc(30 * var(--u)); }
  #oshow { color: var(--c-clay); margin-bottom: calc(10 * var(--u)); }
  #otitle { text-wrap: balance; font-size: calc(58 * var(--u)); line-height: 1.1; color: var(--c-paper); letter-spacing: var(--tr-display); }
</style></head><body>
<div id="stage">
  <div id="bg"></div>
  <div id="col"><div id="cshow" class="label"></div><div id="crule"></div><div id="ctitle" class="serif"></div></div>
  <div id="lt"><div id="orule"></div><div id="panel"><div id="oshow" class="label"></div><div id="otitle" class="serif"></div></div></div>
</div>
<script src="../../lib/timeline.js"></script>
<script>
  var P = AVE.props, M = AVE.tokens.motion, $ = AVE.el, card = P.mode === "card";
  AVE.text("cshow", P.show); AVE.text("ctitle", P.title); AVE.text("oshow", P.show); AVE.text("otitle", P.title);
  var bottom = (typeof P.bottom === "number" ? P.bottom : 0.555);
  $("lt").style.bottom = ((1 - bottom) * AVE.canvas.h) + "px";
  $("bg").style.display = card ? "block" : "none";
  $("col").style.display = card ? "block" : "none";
  $("lt").style.display = card ? "none" : "flex";
  AVE.ready(function (t) {
    var h = AVE.hold(t);
    if (card) {
      /* the card is opaque from the first frame; the words land fast so a 1.3 s card is readable for about a second */
      $("bg").style.opacity = h;
      $("col").style.opacity = h;
      /* the settle starts before frame 0, so the very first frame (a platform's thumbnail) already carries the title */
      $("crule").style.transform = "scaleX(" + AVE.phase(t, -0.2, 0.3, "out") + ")";
      AVE.rise($("cshow"), AVE.phase(t, -0.3, 0.34, "out"));
      AVE.rise($("ctitle"), AVE.phase(t, -0.28, 0.34, "out"));
    } else {
      $("lt").style.opacity = h;
      $("orule").style.transform = "scaleY(" + AVE.phase(t, 0, M.in_s * 0.6, "out") + ")";
      var open = (1 - AVE.phase(t, 0.06, M.in_s * 0.9, "out")) * 100;
      $("panel").style.clipPath = "inset(0 " + open + "% 0 0)";
      AVE.rise($("oshow"), AVE.phase(t, 0.2, M.in_s, "out"));
      AVE.rise($("otitle"), AVE.phase(t, 0.2 + M.stagger_s, M.in_s, "out"));
    }
  });
</script></body></html>
