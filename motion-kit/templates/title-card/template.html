<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css">
<style>
  #bg { position: absolute; inset: 0; background: var(--c-ink); }
  #kicker { position: absolute; left: var(--mx); top: var(--my); color: var(--c-clay); }
  #col { position: absolute; left: var(--mx); right: var(--mx); top: 50%; transform: translateY(-50%); }
  #title { font-size: var(--fs-display); line-height: 1.04; color: var(--c-paper); letter-spacing: var(--tr-display); max-width: 82%; }
  #foot { position: absolute; left: var(--mx); right: var(--mx); bottom: var(--my); }
  #rule { height: calc(2 * var(--u)); background: var(--c-stone); transform-origin: 0 50%; margin-bottom: calc(24 * var(--u)); }
  #sub { color: var(--c-paper-dim); }
</style></head><body>
<div id="stage"><div id="bg"></div><div id="kicker" class="label"></div><div id="col"><div id="title" class="serif"></div></div>
<div id="foot"><div id="rule"></div><div id="sub" class="label"></div></div></div>
<script src="../../lib/timeline.js"></script>
<script>
  var P = AVE.props, M = AVE.tokens.motion, $ = AVE.el, bgA = AVE.backdropAlpha(P.backdrop);
  AVE.text("kicker", P.kicker); AVE.text("title", P.title); AVE.text("sub", P.subtitle);
  AVE.ready(function (t) {
    var h = AVE.hold(t);
    $("bg").style.opacity = bgA * AVE.phase(t, 0, M.in_s * 1.2, "inout") * h;
    $("col").style.opacity = h; $("foot").style.opacity = h;
    $("kicker").style.opacity = AVE.phase(t, 0.3, M.in_s, "out") * h;
    AVE.rise($("title"), AVE.phase(t, 0.4, M.in_s * 1.3, "out"));
    $("rule").style.transform = "scaleX(" + AVE.phase(t, 0.6, M.in_s * 1.6, "out") + ")";
    $("sub").style.opacity = AVE.phase(t, 0.8, M.in_s, "out");
  });
</script></body></html>
