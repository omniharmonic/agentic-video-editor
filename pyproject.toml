[project]
name = "agentic-video-editor"
version = "0.1.0"
description = "Agent-agnostic toolkit and skills for editing podcasts and video with any MCP-capable AI agent and DaVinci Resolve."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Benjamin Life" }]
requires-python = ">=3.11"
keywords = ["video-editing", "podcast", "ffmpeg", "davinci-resolve", "mcp", "ai-agents", "multicam"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pyyaml>=6",
  "pillow>=10",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.9", "pyobjc-framework-Vision>=10; sys_platform == 'darwin'"]
audio = ["librosa>=0.10"]
motion = ["playwright>=1.45"]
publish = ["google-api-python-client>=2.120", "google-auth-oauthlib>=1.2", "requests>=2.31", "keyring>=25", "pypdf>=6,<7"]
assets = ["requests>=2.31"]
desktop = ["pywebview>=5,<7", "cryptography==50.0.2", "keyring>=25", "requests>=2.31"]
all = ["agentic-video-editor[vision,audio,motion,publish,assets,desktop]"]

# TODO(publish): replace OWNER with the real GitHub owner once the repository URL is known (also in README.md and docs/getting-started.md).
[project.urls]
Homepage = "https://github.com/omniharmonic/agentic-video-editor"
Documentation = "https://github.com/omniharmonic/agentic-video-editor/blob/main/docs/getting-started.md"
Issues = "https://github.com/omniharmonic/agentic-video-editor/issues"
Changelog = "https://github.com/omniharmonic/agentic-video-editor/blob/main/CHANGELOG.md"

[project.scripts]
ave = "ave.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.5", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The sdist must carry everything the wheel force-includes (config, skills, motion-kit, content), or building the wheel FROM
# the sdist (plain `uv build`, `pip install x.tar.gz`) fails. tests/test_packaging.py builds both and checks.
[tool.hatch.build.targets.sdist]
include = ["/src", "/config", "/skills","/motion-kit", "/content", "/docs", "/scripts", "/tests",
           "/README.md", "/LICENSE", "/CHANGELOG.md", "/AGENTS.md", "/THIRD_PARTY_NOTICES.md", "/uv.lock", "/pyproject.toml"]
# .agents/skills and .claude/skills are symlinks to skills/. Hatch's walker visits a real directory once, through whichever
# path it meets first (".agents" sorts before "skills"), so left in they would swallow the real skills/ folder.
exclude = [".agents", ".claude"]
skip-excluded-dirs = true   # without this, exclude only filters files and the walker still enters (and "uses up") the symlinked dirs

[tool.hatch.build.targets.wheel]
packages = ["src/ave"]

# The data the code reads at run time ships inside the wheel as ave/_data/ (see src/ave/resources.py).
[tool.hatch.build.targets.wheel.force-include]
"config" = "ave/_data/config"
"skills" = "ave/_data/skills"
"motion-kit" = "ave/_data/motion-kit"
"content" = "ave/_data/content"
"AGENTS.md" = "ave/_data/AGENTS.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
  "real_motion: render the title overlay with Chromium instead of the fast stub",
  "apple: needs macOS / Apple frameworks (Vision, VideoToolbox, FluidAudio); skipped elsewhere",
  "resolve: needs a running DaVinci Resolve",
  "network: needs the internet",
]
