name: debug
on:
  push:
    branches: [ci-fix]
  workflow_dispatch:
jobs:
  dbg:
    name: dbg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - name: apt ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: brew ffmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: probe
        run: |
          which -a ffmpeg; ffmpeg -version | head -3
          ffmpeg -hide_banner -filters | grep -wE "ass|subtitles|drawtext" || echo "NO ass/subtitles/drawtext"
          if [ "$RUNNER_OS" = macOS ]; then brew list --versions | grep -iE "ffmpeg|libass"; brew info ffmpeg | head -20; brew search ffmpeg; fi
      - run: uv sync --all-extras --python 3.12
      - name: overlay probe
        run: bash scripts_dbg/probe_ov.sh
      - name: dbg test
        if: runner.os == 'Linux'
        run: uv run pytest -q -s tests/test_zz_dbg.py || true
      - name: failing tests
        if: runner.os == 'Linux'
        run: uv run pytest -q -q --timeout 300 tests/test_compile.py -k "overlay_alpha_blends or overlay_video_with_alpha or spiky_speech" -p no:cacheprovider || true
