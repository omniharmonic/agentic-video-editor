name: debug
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv sync --all-extras --python 3.12
      - name: music test with numba settings
        env: {NUMBA_NUM_THREADS: "1", NUMBA_THREADING_LAYER: workqueue}
        run: uv run pytest -q --timeout 120 -x tests/test_assets_music.py
      - name: errors seen at 79% (collect which tests error)
        run: uv run pytest -q --timeout 120 -m "not apple and not resolve and not network" -p no:xdist -k "not music" -x --maxfail=5 tests/test_content_byline.py tests/test_package.py tests/test_ui.py 2>&1 | tail -40
